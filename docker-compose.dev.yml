# Dev stack for priceboard FastAPI + Redis (dev.atz.vn / localhost)
# Usage:
#   docker compose -f docker-compose.dev.yml up --build
# API: http://127.0.0.1:8000  |  WS: ws://127.0.0.1:8000/ws/priceboard
#
# Does NOT replace production docker-compose.yml / atz-redis.
# Project name isolates this stack from prod compose (same dir /opt/vnstocks).
name: atz_priceboard

services:
  redis:
    image: redis:7-alpine
    container_name: atz-redis-dev
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory",
        "128mb",
        "--maxmemory-policy",
        "volatile-lru",
      ]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - priceboard_dev

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: atz-priceboard-api-dev
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379/0
      PRICEBOARD_CHANNEL: priceboard_ticks
      PRICEBOARD_HASH: priceboard:quotes
      FRONTEND_DIR: /app/frontend
      TRADING_DB_PATH: /app/data/dev_trading.db
      TRADING_CONFIG: /app/config/trading_station.yaml
      LOG_LEVEL: INFO
    ports:
      # localhost tunnel + nginx (via Docker DNS on vnstocks_default)
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      - ./config/trading_station.yaml:/app/config/trading_station.yaml:ro
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - priceboard_dev
      # nginx-reverse-proxy resolves atz-priceboard-api-dev for dev.atz.vn
      - vnstocks_default

  ssi-worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: atz-ssi-worker-dev
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    # Host `.env` (cùng thư mục) được Compose dùng cho ${SSI_*} — không commit secret.
    environment:
      REDIS_URL: redis://redis:6379/0
      PRICEBOARD_CHANNEL: priceboard_ticks
      PRICEBOARD_HASH: priceboard:quotes
      PRICEBOARD_CONFIG: /app/config/priceboard.yaml
      # mock (default) | ssi — ssi cần SSI_CONSUMER_ID + SSI_CONSUMER_SECRET trong .env
      PRICEBOARD_SOURCE: ${PRICEBOARD_SOURCE:-mock}
      SSI_CONSUMER_ID: ${SSI_CONSUMER_ID:-}
      SSI_CONSUMER_SECRET: ${SSI_CONSUMER_SECRET:-}
      SSI_WS_URL: ${SSI_WS_URL:-wss://stream.ssi.com.vn/ws/v3}
      SSI_AUTH_URL: ${SSI_AUTH_URL:-https://api.ssi.com.vn/api/v3/auth/token}
      PRICEBOARD_SSI_CHANNELS: ${PRICEBOARD_SSI_CHANNELS:-DATA,X-Quote,X-Trade,MI}
      MOCK_TICK_INTERVAL_MS: "250"
      LOG_LEVEL: INFO
    command: ["python", "-m", "backend.ssi_worker"]
    volumes:
      - ./backend:/app/backend
      - ./config/priceboard.yaml:/app/config/priceboard.yaml:ro
    networks:
      - priceboard_dev

networks:
  priceboard_dev:
    name: atz_priceboard_dev
  vnstocks_default:
    external: true

volumes:
  redis_dev_data:
