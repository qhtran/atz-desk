# ATZ Desk — dev stack FastAPI + Redis + Nginx edge (dev.atz.vn / localhost)
# Usage:
#   docker compose -f docker-compose.dev.yml up --build
#   docker compose -f docker-compose.dev.yml --profile edge up --build   # + nginx :8080
#   Hot-reload: bỏ comment khối volumes backend/frontend + build.target dev (xem service api)
#
# API trực tiếp: http://127.0.0.1:8000  |  Qua nginx (profile edge): http://127.0.0.1:8080
# Authentik: ngoài stack (/opt/authentik). VPS sync deploy/nginx_dev.conf → nginx-reverse-proxy.
#
# Does NOT replace production docker-compose.yml / atz-redis.
name: atz_desk

x-api-build: &api_build
  context: .
  dockerfile: Dockerfile.dev
  target: runtime

services:
  redis:
    image: redis:7-alpine
    container_name: atz-redis-dev
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory",
        "128mb",
        "--maxmemory-policy",
        "volatile-lru",
      ]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - priceboard_dev

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
      # target: dev  # + bind-mount backend/frontend bên dưới để hot-reload
      target: runtime
    container_name: atz-desk-api-dev
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379/0
      PRICEBOARD_CHANNEL: priceboard_ticks
      PRICEBOARD_HASH: priceboard:quotes
      FRONTEND_DIR: /app/frontend
      DEBUG_OVERLAY_CONFIG: /app/config/debug_overlay.yaml
      OHLCV_BARS_DIR: /app/data/ohlcv
      PORTFOLIO_DB_PATH: /app/data/portfolio.db
      TRADING_DB_PATH: /app/data/dev_trading.db
      MARKET_DB_PATH: /app/data/market.db
      TRADING_CONFIG: /app/config/trading_station.yaml
      F3_ALERTS_CONFIG: /app/config/f3_alerts.yaml
      LOG_LEVEL: INFO
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # CI/immutable: code baked in image. Hot-reload: target dev + uncomment:
      # - ./backend:/app/backend
      # - ./frontend:/app/frontend
      - ./config/debug_overlay.yaml:/app/config/debug_overlay.yaml:ro
      - ./config/trading_station.yaml:/app/config/trading_station.yaml:ro
      - ./config/stream_alerts.yaml:/app/config/stream_alerts.yaml:ro
      - ./config/f3_alerts.yaml:/app/config/f3_alerts.yaml:ro
      - ./data/ohlcv:/app/data/ohlcv:ro
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - priceboard_dev
      - vnstocks_default

  ssi-worker:
    build: *api_build
    container_name: atz-ssi-worker-dev
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379/0
      PRICEBOARD_CHANNEL: priceboard_ticks
      PRICEBOARD_HASH: priceboard:quotes
      PRICEBOARD_CONFIG: /app/config/priceboard.yaml
      PRICEBOARD_SOURCE: ${PRICEBOARD_SOURCE:-ssi}
      PRICEBOARD_REST_BOOTSTRAP: ${PRICEBOARD_REST_BOOTSTRAP:-1}
      SSI_CONSUMER_ID: ${SSI_CONSUMER_ID:-}
      SSI_CONSUMER_SECRET: ${SSI_CONSUMER_SECRET:-}
      SSI_WS_URL: ${SSI_WS_URL:-wss://stream.ssi.com.vn/ws/v3}
      SSI_AUTH_URL: ${SSI_AUTH_URL:-https://api.ssi.com.vn/api/v3/auth/token}
      PRICEBOARD_SSI_CHANNELS: ${PRICEBOARD_SSI_CHANNELS:-DATA,X-Quote,X-Trade,MI}
      MOCK_TICK_INTERVAL_MS: "250"
      MARKET_DB_PATH: /app/data/market.db
      LOG_LEVEL: INFO
    command: ["python", "-m", "backend.ssi_worker"]
    volumes:
      - ./config/priceboard.yaml:/app/config/priceboard.yaml:ro
      - ./data:/app/data
    networks:
      - priceboard_dev

  nginx:
    profiles: ["edge"]
    image: nginx:1.27-alpine
    container_name: atz-desk-nginx-dev
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./deploy/nginx_compose.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/atz/frontend:ro
      - ./deploy/nginx_forward_auth.inc:/etc/nginx/snippets/atz_forward_auth.inc:ro
    environment:
      # Set ENABLE_FORWARD_AUTH=1 + join authentik network khi cần test ForwardAuth trên compose
      ENABLE_FORWARD_AUTH: ${ENABLE_FORWARD_AUTH:-0}
    networks:
      - priceboard_dev

networks:
  priceboard_dev:
    name: atz_desk_dev
  vnstocks_default:
    external: true

volumes:
  redis_dev_data:
