<!DOCTYPE html>
<html lang="vi" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>atz · iBoard Realtime</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: [
              "Inter",
              "IBM Plex Sans",
              "system-ui",
              "-apple-system",
              "Segoe UI",
              "sans-serif",
            ],
          },
          colors: {
            ssi: {
              ceil: "#ff00ff",
              floor: "#00ffff",
              up: "#00ff00",
              down: "#ff0000",
              ref: "#ffd900",
            },
          },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { color-scheme: dark; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: #0a0a0a;
      color: #e5e5e5;
      font-size: 13px;
      letter-spacing: -0.01em;
      line-height: 1.25;
    }
    .flash-up { animation: flashUp 0.55s ease-out; }
    .flash-down { animation: flashDown 0.55s ease-out; }
    @keyframes flashUp {
      0% { background-color: rgba(21, 128, 61, 0.5); }
      100% { background-color: transparent; }
    }
    @keyframes flashDown {
      0% { background-color: rgba(185, 28, 28, 0.5); }
      100% { background-color: transparent; }
    }

    .link-quiet {
      color: #a3a3a3;
      text-decoration: none;
      font-size: 12px;
      font-weight: 500;
      padding: 4px 8px;
      border-radius: 2px;
    }
    .link-quiet:hover { color: #fff; background: rgba(255,255,255,0.04); }

    .search-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .search-wrap svg {
      position: absolute;
      left: 8px;
      width: 14px;
      height: 14px;
      color: #737373;
      pointer-events: none;
    }
    .search-wrap input {
      width: 200px;
      max-width: 36vw;
      height: 28px;
      padding: 0 10px 0 28px;
      border: 1px solid #2a2a2a;
      border-radius: 3px;
      background: #111;
      color: #e5e5e5;
      font-size: 12px;
      outline: none;
    }
    .search-wrap input:focus {
      border-color: #525252;
      background: #141414;
    }
    .search-wrap input::placeholder { color: #525252; }

    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border: 1px solid #2a2a2a;
      border-radius: 3px;
      background: #111;
      color: #a3a3a3;
      cursor: pointer;
      padding: 0;
    }
    .icon-btn:hover { color: #fff; border-color: #3a3a3a; }
    .icon-btn svg { width: 14px; height: 14px; }

    .settings-menu {
      position: absolute;
      right: 0;
      top: calc(100% + 4px);
      min-width: 180px;
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 3px;
      padding: 6px;
      z-index: 50;
      display: none;
      box-shadow: 0 8px 24px rgba(0,0,0,0.45);
    }
    .settings-menu.open { display: block; }
    .settings-menu button {
      display: block;
      width: 100%;
      text-align: left;
      background: transparent;
      border: 0;
      color: #d4d4d4;
      font-size: 12px;
      padding: 6px 8px;
      cursor: pointer;
      border-radius: 2px;
    }
    .settings-menu button:hover { background: #1a1a1a; color: #fff; }

    #index-bar {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      padding: 8px 10px;
      border-bottom: 1px solid #2a2a2a;
      background: #0a0a0a;
    }
    @media (max-width: 1100px) {
      #index-bar { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 640px) {
      #index-bar { grid-template-columns: 1fr; }
    }

    .idx-card {
      display: flex;
      flex-direction: column;
      gap: 6px;
      border: 1px solid #2a2a2a;
      background: linear-gradient(180deg, #121212 0%, #0d0d0d 100%);
      padding: 8px 10px;
      min-width: 0;
      border-radius: 2px;
    }
    .idx-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }
    .idx-card .spark {
      width: 88px;
      height: 36px;
      display: block;
      flex-shrink: 0;
    }
    .idx-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 10px;
      font-size: 10px;
      color: #737373;
      border-top: 1px solid #1f1f1f;
      padding-top: 6px;
    }
    .idx-meta .k { color: #525252; margin-right: 3px; }
    .idx-breadth span { font-variant-numeric: tabular-nums; font-weight: 600; }

    .market-bar {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px 10px;
      border-bottom: 1px solid #2a2a2a;
      background: #0c0c0c;
    }
    .mkt-tab {
      display: inline-flex;
      align-items: center;
      height: 26px;
      padding: 0 12px;
      border: 1px solid #2a2a2a;
      border-radius: 2px;
      background: #111;
      color: #a3a3a3;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.02em;
      cursor: pointer;
    }
    .mkt-tab:hover { color: #e5e5e5; border-color: #3a3a3a; }
    .mkt-tab.is-active {
      color: #0a0a0a;
      background: #ffd900;
      border-color: #ffd900;
    }

    #board-wrap {
      overflow: auto;
      max-height: calc(100vh - 210px);
      border: 1px solid #2a2a2a;
      border-top: 0;
    }
    #board-table {
      border-collapse: separate;
      border-spacing: 0;
      min-width: 1480px;
      width: 100%;
    }
    #board-table th,
    #board-table td {
      border-bottom: 1px solid #2a2a2a;
      border-right: 1px solid #2a2a2a;
      padding: 0.125rem 0.375rem;
      white-space: nowrap;
      line-height: 1.25;
      font-size: 13px;
    }
    #board-table thead th {
      background: #111111;
      color: #a3a3a3;
      font-weight: 500;
      text-align: right;
      position: sticky;
      z-index: 30;
    }
    #board-table thead tr:nth-child(1) th { top: 0; }
    #board-table thead tr:nth-child(2) th { top: 24px; }
    #board-table tbody tr:hover { background-color: rgba(42, 42, 42, 0.55); }
    #board-table td.num {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    #board-table th.th-pin,
    #board-table td.pin-cell {
      position: sticky;
      left: 0;
      width: 28px;
      min-width: 28px;
      max-width: 28px;
      text-align: center;
      padding-left: 0.25rem;
      padding-right: 0.25rem;
      background: #0a0a0a;
      z-index: 12;
    }
    #board-table thead th.th-pin {
      background: #111111;
      z-index: 40;
    }
    #board-table th.th-sym,
    #board-table td.sym {
      position: sticky;
      left: 28px;
      z-index: 11;
      text-align: left;
      background: #0a0a0a;
    }
    #board-table thead th.th-sym {
      background: #111111;
      z-index: 40;
    }
    #board-table td.sym {
      font-weight: 700;
      color: #ffffff;
    }
    #board-table tbody tr:hover td.pin-cell,
    #board-table tbody tr:hover td.sym {
      background-color: #1a1a1a;
    }

    #board-table tbody tr.is-pinned td {
      position: sticky;
      z-index: 25;
      background-color: #12100a;
      border-bottom-color: #ffd900;
      box-shadow: inset 0 -1px 0 rgba(255, 217, 0, 0.55);
    }
    #board-table tbody tr.is-pinned td.pin-cell,
    #board-table tbody tr.is-pinned td.sym {
      z-index: 26;
      background-color: #12100a;
    }
    #board-table tbody tr.is-pinned:hover td {
      background-color: #1c180c;
    }
    #board-table tbody tr.is-pinned:hover td.pin-cell,
    #board-table tbody tr.is-pinned:hover td.sym {
      background-color: #1c180c;
    }

    .pin-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      padding: 0;
      margin: 0;
      border: 0;
      background: transparent;
      color: #555;
      cursor: pointer;
      font-size: 12px;
      line-height: 1;
      border-radius: 2px;
    }
    .pin-btn:hover { color: #ffd900; background: rgba(255, 217, 0, 0.08); }
    .pin-btn.pinned { color: #ffd900; }

    .grp-buy { background: rgba(0, 255, 0, 0.03); }
    .grp-match { background: rgba(255, 217, 0, 0.04); }
    .grp-sell { background: rgba(255, 0, 0, 0.03); }
  </style>
</head>

  <script>
    /* ===== State & WS (giữ reconnect / ping / pin / volume remove) ===== */
    const INDEX_SYMBOLS = new Set(["VNINDEX", "VN30", "HNXINDEX", "UPCOMINDEX"]);
    const INDEX_LABEL = {
      VNINDEX: "VN-INDEX",
      VN30: "VN30",
      HNXINDEX: "HNX",
      UPCOMINDEX: "UPCOM",
    };
    const INDEX_ORDER = ["VNINDEX", "VN30", "HNXINDEX", "UPCOMINDEX"];
    const VN30_SET = new Set([
      "ACB", "BCM", "BID", "BVH", "CTG", "FPT", "GAS", "GVR", "HDB", "HPG",
      "LPB", "MBB", "MSN", "MWG", "PLX", "SAB", "SHB", "SSB", "SSI", "STB",
      "TCB", "TPB", "VCB", "VHM", "VIB", "VIC", "VJC", "VNM", "VPB", "VRE",
    ]);
    const PIN_KEY = "atz.iboard.pinned";
    const MARKET_KEY = "atz.iboard.market";
    const VALID_MARKETS = new Set(["HOSE", "VN30", "HNX", "UPCOM"]);

    const state = new Map();
    const sparkHist = new Map();
    let ws = null;
    let retryMs = 1000;
    let pingTimer = null;
    let searchQuery = "";
    let marketTab = VALID_MARKETS.has(localStorage.getItem(MARKET_KEY))
      ? localStorage.getItem(MARKET_KEY)
      : "HOSE";
    let indexStatsTimer = null;

    const elConnDot = document.getElementById("conn-dot");
    const elConnLabel = document.getElementById("conn-label");
    const elIndexBar = document.getElementById("index-bar");
    const elBody = document.getElementById("board-body");
    const elClock = document.getElementById("clock");
    const elSearch = document.getElementById("search-input");
    const elSettingsBtn = document.getElementById("btn-settings");
    const elSettingsMenu = document.getElementById("settings-menu");

    function setConn(status) {
      const map = {
        open: ["bg-[#00ff00]", "connected"],
        connecting: ["bg-[#ffd900]", "connecting…"],
        closed: ["bg-[#ff0000]", "disconnected · retrying"],
      };
      const [cls, label] = map[status] || map.closed;
      elConnDot.className = "inline-block h-2 w-2 rounded-full " + cls;
      elConnLabel.textContent = label;
    }

    function resolveExchange(row) {
      const ex = String(row.exchange || "").toUpperCase();
      if (ex === "HOSE" || ex === "HSX") return "HOSE";
      if (ex === "HNX") return "HNX";
      if (ex === "UPCOM" || ex === "UPX") return "UPCOM";
      if (VN30_SET.has(row.symbol)) return "HOSE";
      return "HOSE";
    }

    function inIndexBasket(indexSym, row) {
      const sym = row.symbol;
      if (INDEX_SYMBOLS.has(sym)) return false;
      if (indexSym === "VN30") return VN30_SET.has(sym);
      const ex = resolveExchange(row);
      if (indexSym === "VNINDEX") return ex === "HOSE";
      if (indexSym === "HNXINDEX") return ex === "HNX";
      if (indexSym === "UPCOMINDEX") return ex === "UPCOM";
      return false;
    }

    function computeBasketStats(indexSym) {
      let up = 0, down = 0, ref = 0, ceil = 0, floor = 0;
      let volSum = 0;
      let valueSum = 0;
      for (const row of state.values()) {
        if (!inIndexBasket(indexSym, row)) continue;
        const last = Number(row.last);
        const r = Number(row.ref);
        const c = Number(row.ceil);
        const f = Number(row.floor);
        const vol = Number(row.volume) || 0;
        volSum += vol;
        if (Number.isFinite(last) && vol > 0) valueSum += last * vol;
        if (Number.isFinite(c) && Number.isFinite(last) && last >= c && c > 0) ceil += 1;
        else if (Number.isFinite(f) && Number.isFinite(last) && last <= f && f > 0) floor += 1;
        else if (Number.isFinite(last) && Number.isFinite(r)) {
          if (last > r) up += 1;
          else if (last < r) down += 1;
          else ref += 1;
        } else ref += 1;
      }
      const idx = state.get(indexSym);
      const idxVol = Number(idx && idx.volume) || 0;
      const idxValue = Number(
        (idx && (idx.tradeValue || idx.value || idx.totalValue)) || 0
      );
      return {
        up, down, ref, ceil, floor,
        volume: idxVol > 0 ? idxVol : volSum,
        valueTy: idxValue > 0
          ? (idxValue > 1e6 ? idxValue / 1e9 : idxValue)
          : valueSum / 1e9,
      };
    }

    function fmtVolShort(v) {
      const n = Number(v);
      if (!Number.isFinite(n) || n <= 0) return "—";
      if (n >= 1e6) return (n / 1e6).toFixed(2) + "M";
      if (n >= 1e3) return (n / 1e3).toFixed(1) + "K";
      return Math.round(n).toLocaleString("en-US");
    }

    function fmtValueTy(v) {
      const n = Number(v);
      if (!Number.isFinite(n) || n <= 0) return "—";
      return n.toFixed(2);
    }

    /* ===== Filters: market tab + search ===== */
    function rowVisible(symbol) {
      const row = state.get(symbol);
      if (!row || INDEX_SYMBOLS.has(symbol)) return false;
      if (marketTab === "VN30") {
        if (!VN30_SET.has(symbol)) return false;
      } else {
        if (resolveExchange(row) !== marketTab) return false;
      }
      if (searchQuery) {
        const q = searchQuery.toUpperCase();
        if (!String(symbol).toUpperCase().includes(q)) return false;
      }
      return true;
    }

    function applyBoardFilter() {
      elBody.querySelectorAll("tr[id^='row-']").forEach((tr) => {
        const sym = tr.id.slice(4);
        tr.style.display = rowVisible(sym) ? "" : "none";
      });
      updatePinnedPositions();
    }

    function setMarketTab(tab) {
      if (!VALID_MARKETS.has(tab)) tab = "HOSE";
      marketTab = tab;
      localStorage.setItem(MARKET_KEY, marketTab);
      document.querySelectorAll(".mkt-tab").forEach((btn) => {
        const on = btn.getAttribute("data-market") === marketTab;
        btn.classList.toggle("is-active", on);
        btn.setAttribute("aria-selected", on ? "true" : "false");
      });
      applyBoardFilter();
    }

    document.querySelectorAll(".mkt-tab").forEach((btn) => {
      btn.addEventListener("click", () => setMarketTab(btn.getAttribute("data-market")));
    });
    setMarketTab(marketTab);

    elSearch.addEventListener("input", () => {
      searchQuery = String(elSearch.value || "").trim();
      applyBoardFilter();
    });

    elSettingsBtn.addEventListener("click", (ev) => {
      ev.stopPropagation();
      const open = !elSettingsMenu.classList.contains("open");
      elSettingsMenu.classList.toggle("open", open);
      elSettingsBtn.setAttribute("aria-expanded", open ? "true" : "false");
    });
    document.addEventListener("click", () => {
      elSettingsMenu.classList.remove("open");
      elSettingsBtn.setAttribute("aria-expanded", "false");
    });
    document.getElementById("btn-clear-pins").addEventListener("click", () => {
      savePins([]);
      elBody.querySelectorAll("tr.is-pinned").forEach((tr) => applyPinVisual(tr, false));
      updatePinnedPositions();
      elSettingsMenu.classList.remove("open");
    });
    document.getElementById("btn-focus-search").addEventListener("click", () => {
      elSearch.focus();
      elSearch.select();
      elSettingsMenu.classList.remove("open");
    });

    function removeEquityRow(symbol) {
      state.delete(symbol);
      const tr = document.getElementById("row-" + symbol);
      if (tr) tr.remove();
      const pins = loadPins().filter((s) => s !== symbol);
      savePins(pins);
      scheduleIndexStatsRefresh();
      updatePinnedPositions();
    }

    /* ===== Pin (DOM move only) ===== */
    function loadPins() {
      try {
        const raw = JSON.parse(localStorage.getItem(PIN_KEY) || "[]");
        return Array.isArray(raw) ? raw.map(String) : [];
      } catch (_) {
        return [];
      }
    }

    function savePins(arr) {
      localStorage.setItem(PIN_KEY, JSON.stringify(arr));
    }

    function applyPinVisual(tr, pinned) {
      const btn = tr.querySelector("[data-pin]");
      if (pinned) {
        tr.classList.add("is-pinned");
        if (btn) {
          btn.classList.add("pinned");
          btn.setAttribute("aria-pressed", "true");
          btn.title = "Bỏ ghim";
        }
      } else {
        tr.classList.remove("is-pinned");
        tr.querySelectorAll("td").forEach((td) => { td.style.top = ""; });
        if (btn) {
          btn.classList.remove("pinned");
          btn.setAttribute("aria-pressed", "false");
          btn.title = "Ghim mã";
        }
      }
    }

    function lastPinnedRow() {
      let last = null;
      elBody.querySelectorAll("tr.is-pinned").forEach((r) => { last = r; });
      return last;
    }

    function updatePinnedPositions() {
      const thead = document.querySelector("#board-table thead");
      if (!thead || !elBody) return;
      const baseTop = thead.offsetHeight;
      const rows = elBody.querySelectorAll("tr.is-pinned");
      let offset = 0;
      rows.forEach((row) => {
        if (row.style.display === "none") return;
        const top = baseTop + offset;
        row.querySelectorAll("td").forEach((td) => {
          td.style.top = top + "px";
        });
        offset += row.offsetHeight || 22;
      });
    }

    function moveRowToPinnedTop(tr) {
      elBody.insertBefore(tr, elBody.firstChild);
    }

    function moveRowAfterPins(tr) {
      const last = lastPinnedRow();
      if (last) elBody.insertBefore(tr, last.nextSibling);
    }

    function togglePin(symbol) {
      const tr = document.getElementById("row-" + symbol);
      if (!tr) return;
      let pins = loadPins().filter((s) => s !== symbol);
      const wasPinned = tr.classList.contains("is-pinned");
      if (wasPinned) {
        savePins(pins);
        applyPinVisual(tr, false);
        moveRowAfterPins(tr);
        updatePinnedPositions();
        return;
      }
      pins.unshift(symbol);
      savePins(pins);
      applyPinVisual(tr, true);
      moveRowToPinnedTop(tr);
      updatePinnedPositions();
    }

    function restorePinnedRows() {
      const pins = loadPins();
      for (let i = pins.length - 1; i >= 0; i--) {
        const tr = document.getElementById("row-" + pins[i]);
        if (!tr) continue;
        applyPinVisual(tr, true);
        elBody.insertBefore(tr, elBody.firstChild);
      }
      updatePinnedPositions();
    }

    window.addEventListener("resize", updatePinnedPositions);

    /* ===== SSI color helpers ===== */
    function priceTone(price, ref, ceil, floor) {
      const p = Number(price);
      const r = Number(ref);
      const c = Number(ceil);
      const f = Number(floor);
      if (!Number.isFinite(p) || !Number.isFinite(r)) return "text-[#ffd900]";
      if (Number.isFinite(c) && p >= c) return "text-[#ff00ff]";
      if (Number.isFinite(f) && p <= f) return "text-[#00ffff]";
      if (p > r) return "text-[#00ff00]";
      if (p < r) return "text-[#ff0000]";
      return "text-[#ffd900]";
    }

    function changeTone(change) {
      if (change > 0) return "text-[#00ff00]";
      if (change < 0) return "text-[#ff0000]";
      return "text-[#ffd900]";
    }

    function fmtPrice(v, kind) {
      if (v == null || v === "" || Number.isNaN(Number(v))) return "";
      if (kind === "index") return Number(v).toFixed(2);
      return Number(v).toLocaleString("en-US");
    }

    function fmtVol(v) {
      const n = Number(v);
      if (!Number.isFinite(n) || n === 0) return "";
      return Math.round(n).toLocaleString("en-US");
    }

    function fmtChange(v) {
      if (v == null || Number.isNaN(Number(v))) return "";
      const n = Number(v);
      return (n > 0 ? "+" : "") + Number(n).toLocaleString("en-US");
    }

    function flashCell(el, change) {
      if (!el || !change) return;
      el.classList.remove("flash-up", "flash-down");
      void el.offsetWidth;
      el.classList.add(change > 0 ? "flash-up" : "flash-down");
    }

    function pushSpark(symbol, value) {
      const arr = sparkHist.get(symbol) || [];
      arr.push(Number(value));
      while (arr.length > 40) arr.shift();
      sparkHist.set(symbol, arr);
      return arr;
    }

    function sparkPath(values) {
      if (!values.length) return "";
      const w = 88, h = 36, pad = 2;
      const min = Math.min(...values);
      const max = Math.max(...values);
      const span = max - min || 1;
      return values
        .map((v, i) => {
          const x = pad + (i / Math.max(values.length - 1, 1)) * (w - pad * 2);
          const y = h - pad - ((v - min) / span) * (h - pad * 2);
          return (i === 0 ? "M" : "L") + x.toFixed(1) + " " + y.toFixed(1);
        })
        .join(" ");
    }

    function enrichDepth(row) {
      if (row.kind === "index") return row;
      if (row.bid1 != null && row.ask1 != null) return row;
      const last = Number(row.last);
      const ceil = Number(row.ceil);
      const floor = Number(row.floor);
      const step = 50;
      const seed = (row.symbol || "").split("").reduce((a, c) => a + c.charCodeAt(0), 0);
      const rnd = (n) => ((seed * 17 + n * 31) % 97) + 3;
      const clamp = (p) => Math.max(floor || p, Math.min(ceil || p, p));

      row.bid1 = row.bid1 ?? clamp(last - step);
      row.bid2 = row.bid2 ?? clamp(last - step * 2);
      row.bid3 = row.bid3 ?? clamp(last - step * 3);
      row.bidVol1 = row.bidVol1 ?? rnd(1) * 100;
      row.bidVol2 = row.bidVol2 ?? rnd(2) * 80;
      row.bidVol3 = row.bidVol3 ?? rnd(3) * 60;
      row.ask1 = row.ask1 ?? clamp(last + step);
      row.ask2 = row.ask2 ?? clamp(last + step * 2);
      row.ask3 = row.ask3 ?? clamp(last + step * 3);
      row.askVol1 = row.askVol1 ?? rnd(4) * 90;
      row.askVol2 = row.askVol2 ?? rnd(5) * 70;
      row.askVol3 = row.askVol3 ?? rnd(6) * 50;
      row.matchVol = row.matchVol ?? Math.max(10, Math.floor((Number(row.volume) || 0) % 5000) || rnd(7) * 10);
      row.foreignBuy = row.foreignBuy ?? rnd(8) * 1000;
      row.foreignSell = row.foreignSell ?? rnd(9) * 800;
      return row;
    }

    function ensureEquityRow(symbol) {
      let tr = document.getElementById("row-" + symbol);
      if (tr) return tr;
      tr = document.createElement("tr");
      tr.id = "row-" + symbol;
      tr.innerHTML = `
        <td class="pin-cell">
          <button type="button" class="pin-btn" data-pin="${symbol}" aria-pressed="false" title="Ghim mã">★</button>
        </td>
        <td class="sym" data-f="symbol"></td>
        <td class="num text-[#ff00ff]" data-f="ceil"></td>
        <td class="num text-[#00ffff]" data-f="floor"></td>
        <td class="num text-[#ffd900]" data-f="ref"></td>
        <td class="num tabular-nums grp-buy" data-f="bid3"></td>
        <td class="num tabular-nums grp-buy text-gray-300" data-f="bidVol3"></td>
        <td class="num tabular-nums grp-buy" data-f="bid2"></td>
        <td class="num tabular-nums grp-buy text-gray-300" data-f="bidVol2"></td>
        <td class="num tabular-nums grp-buy" data-f="bid1"></td>
        <td class="num tabular-nums grp-buy text-gray-300" data-f="bidVol1"></td>
        <td class="num tabular-nums grp-match font-semibold" data-f="last"></td>
        <td class="num tabular-nums grp-match text-gray-300" data-f="matchVol"></td>
        <td class="num tabular-nums grp-match" data-f="change"></td>
        <td class="num tabular-nums grp-sell" data-f="ask1"></td>
        <td class="num tabular-nums grp-sell text-gray-300" data-f="askVol1"></td>
        <td class="num tabular-nums grp-sell" data-f="ask2"></td>
        <td class="num tabular-nums grp-sell text-gray-300" data-f="askVol2"></td>
        <td class="num tabular-nums grp-sell" data-f="ask3"></td>
        <td class="num tabular-nums grp-sell text-gray-300" data-f="askVol3"></td>
        <td class="num tabular-nums text-gray-200" data-f="vol"></td>
        <td class="num tabular-nums text-[#00ff00]" data-f="fbuy"></td>
        <td class="num tabular-nums text-[#ff0000]" data-f="fsell"></td>
      `;
      const btn = tr.querySelector("[data-pin]");
      btn.addEventListener("click", (ev) => {
        ev.preventDefault();
        ev.stopPropagation();
        togglePin(symbol);
      });
      elBody.appendChild(tr);
      return tr;
    }

    function idxCardHtml(row) {
      const hist = sparkHist.get(row.symbol) || [Number(row.last)];
      const tone = changeTone(row.change);
      const stroke = row.change > 0 ? "#00ff00" : row.change < 0 ? "#ff0000" : "#ffd900";
      const label = INDEX_LABEL[row.symbol] || row.symbol;
      const st = computeBasketStats(row.symbol);
      return `
        <div class="idx-card" data-idx="${row.symbol}">
          <div class="idx-card-top">
            <div class="min-w-0">
              <div class="text-[10px] tracking-wide text-gray-500 font-medium">${label}</div>
              <div class="flex items-baseline gap-2 mt-0.5">
                <span class="tabular-nums text-[20px] font-semibold leading-none ${tone}" data-f="last">${fmtPrice(row.last, "index")}</span>
              </div>
              <div class="flex items-baseline gap-2 mt-1">
                <span class="tabular-nums text-[12px] font-medium ${tone}" data-f="chg">${fmtChange(row.change)}</span>
                <span class="tabular-nums text-[12px] font-medium ${tone}" data-f="pct">${row.change_pct > 0 ? "+" : ""}${Number(row.change_pct || 0).toFixed(2)}%</span>
              </div>
            </div>
            <svg class="spark" viewBox="0 0 88 36" aria-hidden="true">
              <path d="${sparkPath(hist)}" fill="none" stroke="${stroke}" stroke-width="1.6" />
            </svg>
          </div>
          <div class="idx-meta">
            <span><span class="k">KL</span><span data-f="ivol">${fmtVolShort(st.volume)}</span> CP</span>
            <span><span class="k">GT</span><span data-f="ival">${fmtValueTy(st.valueTy)}</span> Tỷ</span>
            <span class="idx-breadth">
              <span class="text-[#00ff00]" data-f="up">${st.up}</span>/
              <span class="text-[#ff0000]" data-f="down">${st.down}</span>/
              <span class="text-[#ffd900]" data-f="refn">${st.ref}</span>/
              <span class="text-[#ff00ff]" data-f="ceiln">${st.ceil}</span>/
              <span class="text-[#00ffff]" data-f="floorn">${st.floor}</span>
            </span>
          </div>
        </div>`;
    }

    function renderIndexBar() {
      const idxs = INDEX_ORDER.map((s) => state.get(s)).filter(Boolean);
      elIndexBar.innerHTML = idxs.map(idxCardHtml).join("");
    }

    function patchIndexCardStats(card, indexSym) {
      const st = computeBasketStats(indexSym);
      const set = (sel, val) => {
        const el = card.querySelector(sel);
        if (el) el.textContent = val;
      };
      set('[data-f="ivol"]', fmtVolShort(st.volume));
      set('[data-f="ival"]', fmtValueTy(st.valueTy));
      set('[data-f="up"]', String(st.up));
      set('[data-f="down"]', String(st.down));
      set('[data-f="refn"]', String(st.ref));
      set('[data-f="ceiln"]', String(st.ceil));
      set('[data-f="floorn"]', String(st.floor));
    }

    function refreshAllIndexStats() {
      INDEX_ORDER.forEach((sym) => {
        const card = elIndexBar.querySelector(`[data-idx="${sym}"]`);
        if (card) patchIndexCardStats(card, sym);
      });
    }

    function scheduleIndexStatsRefresh() {
      if (indexStatsTimer) return;
      indexStatsTimer = setTimeout(() => {
        indexStatsTimer = null;
        refreshAllIndexStats();
      }, 200);
    }

    function applyIndex(row, { flash = false } = {}) {
      const prev = state.get(row.symbol);
      pushSpark(row.symbol, row.last);
      state.set(row.symbol, row);

      let card = elIndexBar.querySelector(`[data-idx="${row.symbol}"]`);
      if (!card) {
        renderIndexBar();
        card = elIndexBar.querySelector(`[data-idx="${row.symbol}"]`);
      }
      if (!card) return;

      const tone = changeTone(row.change);
      const stroke = row.change > 0 ? "#00ff00" : row.change < 0 ? "#ff0000" : "#ffd900";
      const lastEl = card.querySelector('[data-f="last"]');
      const chgEl = card.querySelector('[data-f="chg"]');
      const pctEl = card.querySelector('[data-f="pct"]');
      const path = card.querySelector("path");

      lastEl.textContent = fmtPrice(row.last, "index");
      lastEl.className = "tabular-nums text-[20px] font-semibold leading-none " + tone;
      chgEl.textContent = fmtChange(row.change);
      chgEl.className = "tabular-nums text-[12px] font-medium " + tone;
      pctEl.textContent = (row.change_pct > 0 ? "+" : "") + Number(row.change_pct || 0).toFixed(2) + "%";
      pctEl.className = "tabular-nums text-[12px] font-medium " + tone;
      if (path) {
        path.setAttribute("d", sparkPath(sparkHist.get(row.symbol) || []));
        path.setAttribute("stroke", stroke);
      }
      patchIndexCardStats(card, row.symbol);
      if (flash && prev && prev.last !== row.last) {
        flashCell(card, row.change || (row.last > prev.last ? 1 : -1));
      }
    }

    function setPriceCell(td, value, row, extraCls) {
      td.textContent = fmtPrice(value, row.kind);
      td.className = ("num tabular-nums " + (extraCls || "") + " " + priceTone(value, row.ref, row.ceil, row.floor)).trim();
    }

    function applyEquity(row, { flash = false } = {}) {
      const prev = state.get(row.symbol);
      row = enrichDepth({ ...row });
      if (!row.exchange) row.exchange = resolveExchange(row);
      state.set(row.symbol, row);

      const tr = ensureEquityRow(row.symbol);
      tr.dataset.exchange = resolveExchange(row);
      tr.style.display = rowVisible(row.symbol) ? "" : "none";
      tr.querySelector('[data-f="symbol"]').textContent = row.symbol;
      tr.querySelector('[data-f="ceil"]').textContent = fmtPrice(row.ceil);
      tr.querySelector('[data-f="floor"]').textContent = fmtPrice(row.floor);
      tr.querySelector('[data-f="ref"]').textContent = fmtPrice(row.ref);

      setPriceCell(tr.querySelector('[data-f="bid3"]'), row.bid3, row, "grp-buy");
      tr.querySelector('[data-f="bidVol3"]').textContent = fmtVol(row.bidVol3);
      setPriceCell(tr.querySelector('[data-f="bid2"]'), row.bid2, row, "grp-buy");
      tr.querySelector('[data-f="bidVol2"]').textContent = fmtVol(row.bidVol2);
      setPriceCell(tr.querySelector('[data-f="bid1"]'), row.bid1, row, "grp-buy");
      tr.querySelector('[data-f="bidVol1"]').textContent = fmtVol(row.bidVol1);

      const lastEl = tr.querySelector('[data-f="last"]');
      setPriceCell(lastEl, row.last, row, "grp-match font-semibold");

      tr.querySelector('[data-f="matchVol"]').textContent = fmtVol(row.matchVol);
      const chgEl = tr.querySelector('[data-f="change"]');
      chgEl.textContent = fmtChange(row.change);
      chgEl.className = "num tabular-nums grp-match " + changeTone(row.change);

      setPriceCell(tr.querySelector('[data-f="ask1"]'), row.ask1, row, "grp-sell");
      tr.querySelector('[data-f="askVol1"]').textContent = fmtVol(row.askVol1);
      setPriceCell(tr.querySelector('[data-f="ask2"]'), row.ask2, row, "grp-sell");
      tr.querySelector('[data-f="askVol2"]').textContent = fmtVol(row.askVol2);
      setPriceCell(tr.querySelector('[data-f="ask3"]'), row.ask3, row, "grp-sell");
      tr.querySelector('[data-f="askVol3"]').textContent = fmtVol(row.askVol3);

      tr.querySelector('[data-f="vol"]').textContent = fmtVol(row.volume);
      tr.querySelector('[data-f="fbuy"]').textContent = fmtVol(row.foreignBuy);
      tr.querySelector('[data-f="fsell"]').textContent = fmtVol(row.foreignSell);

      if (flash && prev && prev.last !== row.last) {
        flashCell(lastEl, row.change || (row.last > prev.last ? 1 : -1));
      }
      scheduleIndexStatsRefresh();
    }

    function applyRow(row, opts = {}) {
      if (INDEX_SYMBOLS.has(row.symbol)) {
        applyIndex(row, opts);
        return;
      }
      applyEquity(row, opts);
    }

    function handleMessage(raw) {
      let msg;
      try { msg = JSON.parse(raw); } catch { return; }
      if (msg.type === "snapshot" && Array.isArray(msg.rows)) {
        elBody.innerHTML = "";
        elIndexBar.innerHTML = "";
        state.clear();
        sparkHist.clear();
        const rows = [...msg.rows].sort((a, b) => {
          const ai = INDEX_SYMBOLS.has(a.symbol) ? 0 : 1;
          const bi = INDEX_SYMBOLS.has(b.symbol) ? 0 : 1;
          if (ai !== bi) return ai - bi;
          return String(a.symbol).localeCompare(String(b.symbol));
        });
        rows.forEach((r) => {
          if (INDEX_SYMBOLS.has(r.symbol)) pushSpark(r.symbol, r.last);
          applyRow(r, { flash: false });
        });
        renderIndexBar();
        rows.forEach((r) => {
          if (INDEX_SYMBOLS.has(r.symbol)) applyIndex(r, { flash: false });
        });
        restorePinnedRows();
        applyBoardFilter();
        refreshAllIndexStats();
        return;
      }
      if (msg.type === "remove" && msg.symbol) {
        removeEquityRow(msg.symbol);
        return;
      }
      if (msg.type === "tick" && msg.symbol) {
        applyRow(msg, { flash: true });
        return;
      }
      if (msg.symbol && (msg.last != null || msg.kind)) {
        applyRow(msg, { flash: true });
        return;
      }
      if (msg.type === "pong") return;
    }

    function wsUrl() {
      const proto = location.protocol === "https:" ? "wss:" : "ws:";
      return `${proto}//${location.host}/ws/priceboard`;
    }

    function connect() {
      setConn("connecting");
      ws = new WebSocket(wsUrl());
      ws.onopen = () => {
        setConn("open");
        retryMs = 1000;
        clearInterval(pingTimer);
        pingTimer = setInterval(() => {
          if (ws && ws.readyState === WebSocket.OPEN) ws.send("ping");
        }, 25000);
      };
      ws.onmessage = (ev) => handleMessage(ev.data);
      ws.onclose = () => {
        setConn("closed");
        clearInterval(pingTimer);
        setTimeout(connect, retryMs);
        retryMs = Math.min(retryMs * 1.7, 15000);
      };
      ws.onerror = () => {
        try { ws.close(); } catch (_) {}
      };
    }

    setInterval(() => {
      elClock.textContent = new Date().toLocaleTimeString("vi-VN", { hour12: false });
    }, 1000);

    connect();
  </script>
</body>
</html>
