# Nginx HTTP site for ATZ Desk (FastAPI) — atz.vn (prod-desk)
# Target: nginx-reverse-proxy /etc/nginx/conf.d/atz.vn.conf
#
# Unified Login (2026-11-05): soft ForwardAuth giống dev.atz.vn —
#   / + static public; /api|/ws soft-auth (401 → continue, Desk Session cookie);
#   /api/auth/login|logout bypass auth_request (Set-Cookie không bị 302 outpost).
# Hard-auth cũ khiến POST /api/auth/login → 302 Authentik → SPA báo "không kết nối".
#
# Apply: docker cp + nginx -t + reload (hoặc scripts/apply-prod-atz-nginx.sh).

server {
    listen 80;
    server_name atz.vn;

    location /.well-known/acme-challenge/ {
        root /etc/letsencrypt/acme-webroot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl proxy_protocol;
    server_name atz.vn;

    ssl_certificate     /etc/letsencrypt/live/atz.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/atz.vn/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    include /etc/nginx/snippets/security-headers.conf;
    proxy_hide_header X-Powered-By;

    client_max_body_size 4m;
    proxy_buffers 8 16k;
    proxy_buffer_size 32k;

    location /healthz {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $desk_prod_up http://atz-desk-api:8000;
        proxy_pass $desk_prod_up;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    location /outpost.goauthentik.io {
        proxy_pass http://authentik-server:9000/outpost.goauthentik.io;
        proxy_http_version 1.1;
        proxy_set_header Host $ak_http_host;
        proxy_set_header X-Original-URL $scheme://$ak_http_host$request_uri;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $ak_http_host;
        proxy_set_header Upgrade "";
        proxy_set_header Connection "";
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_read_timeout 60;
    }

    # Soft continue khi chưa có Outpost session — Desk Session cookie vẫn tới FastAPI
    location @atz_soft_auth_continue {
        internal;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $desk_prod_up http://atz-desk-api:8000;
        proxy_pass $desk_prod_up$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_keepalive;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;
    }

    location = /api/auth/login {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $desk_prod_up http://atz-desk-api:8000;
        proxy_pass $desk_prod_up;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location = /api/auth/logout {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $desk_prod_up http://atz-desk-api:8000;
        proxy_pass $desk_prod_up;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location /api/ {
        include /etc/nginx/snippets/atz_forward_auth_optional.inc;

        resolver 127.0.0.11 valid=10s ipv6=off;
        set $desk_prod_up http://atz-desk-api:8000;
        proxy_pass $desk_prod_up;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location /ws/ {
        include /etc/nginx/snippets/atz_forward_auth_optional.inc;

        resolver 127.0.0.11 valid=10s ipv6=off;
        set $desk_prod_up http://atz-desk-api:8000;
        proxy_pass $desk_prod_up;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_keepalive;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;
    }

    # SPA public — Welcome Gate / Desk Session (không hard-redirect auth.atz.vn)
    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $desk_prod_up http://atz-desk-api:8000;
        proxy_pass $desk_prod_up;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location @goauthentik_proxy_signin {
        internal;
        add_header Set-Cookie $auth_cookie;
        include /etc/nginx/snippets/security-headers.conf;
        return 302 $scheme://$http_host/outpost.goauthentik.io/start?rd=$scheme://$http_host$request_uri;
    }
}
