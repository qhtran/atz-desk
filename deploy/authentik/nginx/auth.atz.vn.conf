server {
    listen 80;
    server_name auth.atz.vn;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl;
    server_name auth.atz.vn;

    ssl_certificate /etc/letsencrypt/live/auth.atz.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.atz.vn/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 100m;
    proxy_buffers 8 16k;
    proxy_buffer_size 32k;

    location / {
        proxy_pass http://authentik-server:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $ak_http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_keepalive;
        proxy_read_timeout 86400;
    }
}
