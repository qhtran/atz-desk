version: 1
metadata:
  name: atz.vn forward auth
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  - model: authentik_providers_proxy.proxyprovider
    identifiers:
      name: atz.vn
    attrs:
      mode: forward_domain
      external_host: https://atz.vn
      cookie_domain: atz.vn
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
  - model: authentik_core.application
    identifiers:
      slug: atz
    attrs:
      name: atz.vn
      slug: atz
      provider: !Find [authentik_providers_proxy.proxyprovider, [name, atz.vn]]
      meta_launch_url: https://atz.vn
      policy_engine_mode: any
      open_in_new_tab: false
  - model: authentik_outposts.outpost
    identifiers:
      name: authentik Embedded Outpost
    attrs:
      config:
        authentik_host: https://auth.atz.vn
      providers:
        - !Find [authentik_providers_proxy.proxyprovider, [name, atz.vn]]
