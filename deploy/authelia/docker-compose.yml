services:
  redis:
    image: redis:7-alpine
    container_name: authelia-redis
    restart: unless-stopped
    command: ["sh", "/run/redis-entrypoint.sh"]
    volumes:
      - redis-data:/data
      - ./redis-entrypoint.sh:/run/redis-entrypoint.sh:ro
      - ./secrets/redis_password:/run/secrets/redis_password:ro
    networks:
      - proxy

  authelia:
    image: authelia/authelia:4.38.19
    container_name: authelia
    restart: unless-stopped
    depends_on:
      - redis
    volumes:
      - ./config:/config
      - ./secrets:/secrets:ro
    environment:
      TZ: Asia/Ho_Chi_Minh
      AUTHELIA_SESSION_SECRET_FILE: /secrets/session_secret
      AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE: /secrets/storage_encryption_key
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE: /secrets/jwt_secret
      AUTHELIA_SESSION_REDIS_PASSWORD_FILE: /secrets/redis_password
    networks:
      - proxy

networks:
  proxy:
    external: true
    name: n8n_proxy-network

volumes:
  redis-data:
