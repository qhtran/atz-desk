---
server:
  address: "tcp://0.0.0.0:9091"
  endpoints:
    authz:
      auth-request:
        implementation: AuthRequest

log:
  level: info
  format: text

default_2fa_method: totp

totp:
  issuer: atz.vn
  period: 30
  skew: 1

webauthn:
  disable: true

authentication_backend:
  file:
    path: /config/users_database.yml
    watch: true
    password:
      algorithm: argon2
      argon2:
        variant: argon2id
        iterations: 3
        memory: 65536
        parallelism: 4
        key_length: 32
        salt_length: 16

access_control:
  default_policy: deny
  rules:
    - domain: auth.atz.vn
      policy: bypass
    - domain:
        - atz.vn
        - www.atz.vn
      policy: two_factor

session:
  cookies:
    - name: authelia_session
      domain: atz.vn
      authelia_url: https://auth.atz.vn
      default_redirection_url: https://atz.vn
      same_site: lax
      expiration: 12h
      inactivity: 1h
      remember_me: 30d
  redis:
    host: redis
    port: 6379

storage:
  local:
    path: /config/db.sqlite3

notifier:
  filesystem:
    filename: /config/notification.txt
