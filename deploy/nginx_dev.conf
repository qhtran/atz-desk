# Nginx reverse proxy for priceboard FastAPI (dev.atz.vn)
# Scaffold ONLY — do not auto-apply to host /opt/nginx.
# Upstream: Docker service published on host 127.0.0.1:8000 (see docker-compose.dev.yml).
#
# After TLS / DNS for dev.atz.vn are ready, include this server{} (or merge carefully)
# into the host nginx HTTP stack. Requires user_confirmed_infra before touching prod SNI.

upstream atz_priceboard_dev {
    server 127.0.0.1:8000;
    keepalive 32;
}

# HTTP → HTTPS (optional when cert exists)
# server {
#     listen 80;
#     server_name dev.atz.vn;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    # listen 443 ssl http2;
    server_name dev.atz.vn;

    # ssl_certificate     /etc/letsencrypt/live/dev.atz.vn/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/dev.atz.vn/privkey.pem;

    client_max_body_size 4m;

    # Static + REST
    location / {
        proxy_pass http://atz_priceboard_dev;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # WebSocket priceboard — long-lived, Upgrade headers, no buffering
    location /ws/ {
        proxy_pass http://atz_priceboard_dev;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;
    }

    location /healthz {
        proxy_pass http://atz_priceboard_dev/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}
