# Nginx HTTP site for ATZ Desk (FastAPI) — dev.atz.vn
# Apply into Docker volume n8n_nginx_config → /etc/nginx/conf.d/dev.atz.vn.conf
# (VPS không dùng sites-available; nginx chạy container nginx-reverse-proxy).
#
# Upstream: container atz-desk-api-dev trên mạng vnstocks_default
# (không dùng 127.0.0.1:8000 từ trong nginx — bind host localhost không tới được).
#
# TLS: listen 8443 ssl proxy_protocol (stream SNI default → 8443; không sửa stream.d).
# ForwardAuth: / + /ws/ bắt buộc; /healthz + /outpost.goauthentik.io + ACME bypass.
# Requires user_confirmed_infra before apply.
#
# Routing contract (đồng bộ docker-compose nginx):
#   /healthz, /outpost.goauthentik.io — bypass auth
#   /api/*  → FastAPI (atz-desk-api-dev:8000)
#   /ws/*   → WebSocket upgrade → FastAPI
#   /       → VPS: proxy FastAPI (SPA từ FRONTEND_DIR). Compose: nginx phục vụ static — xem nginx_compose.conf
# ForwardAuth snippet: deploy/nginx_forward_auth.inc → /etc/nginx/snippets/atz_forward_auth.inc
# Outpost upstream: authentik-server:9000 (Docker net), KHÔNG dùng localhost:9000 từ host.

server {
    listen 80;
    server_name dev.atz.vn;

    location /.well-known/acme-challenge/ {
        root /etc/letsencrypt/acme-webroot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl proxy_protocol;
    server_name dev.atz.vn;

    ssl_certificate     /etc/letsencrypt/live/dev.atz.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.atz.vn/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    include /etc/nginx/snippets/security-headers.conf;
    proxy_hide_header X-Powered-By;

    client_max_body_size 4m;
    proxy_buffers 8 16k;
    proxy_buffer_size 32k;

    # Liveness — no auth
    location /healthz {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $priceboard_up http://atz-desk-api-dev:8000;
        proxy_pass $priceboard_up;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # Authentik outpost — must NOT require auth; clear Upgrade
    location /outpost.goauthentik.io {
        proxy_pass http://authentik-server:9000/outpost.goauthentik.io;
        proxy_http_version 1.1;
        proxy_set_header Host $ak_http_host;
        proxy_set_header X-Original-URL $scheme://$ak_http_host$request_uri;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $ak_http_host;
        proxy_set_header Upgrade "";
        proxy_set_header Connection "";
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_read_timeout 60;
    }

    location /api/ {
        # ForwardAuth + X-authentik-* → FastAPI
        include /etc/nginx/snippets/atz_forward_auth.inc;

        resolver 127.0.0.11 valid=10s ipv6=off;
        set $priceboard_up http://atz-desk-api-dev:8000;
        proxy_pass $priceboard_up;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # WebSocket — auth_request trước Upgrade; cookie session đi cùng handshake
    location /ws/ {
        include /etc/nginx/snippets/atz_forward_auth.inc;

        resolver 127.0.0.11 valid=10s ipv6=off;
        set $priceboard_up http://atz-desk-api-dev:8000;
        proxy_pass $priceboard_up;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_keepalive;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;
    }

    # App SPA — auth required
    location / {
        include /etc/nginx/snippets/atz_forward_auth.inc;

        resolver 127.0.0.11 valid=10s ipv6=off;
        set $priceboard_up http://atz-desk-api-dev:8000;
        proxy_pass $priceboard_up;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location @goauthentik_proxy_signin {
        internal;
        add_header Set-Cookie $auth_cookie;
        include /etc/nginx/snippets/security-headers.conf;
        return 302 $scheme://$http_host/outpost.goauthentik.io/start?rd=$scheme://$http_host$request_uri;
    }
}
