# ATZ Desk — Nginx trong docker-compose.dev.yml (stack atz_desk)
# Listen :8080 — không TLS; dùng local / CI. VPS prod dùng deploy/nginx_dev.conf.
#
# Bật Authentik ForwardAuth: set env ENABLE_FORWARD_AUTH=1 trên service nginx
# và join network tới authentik-server (external). Mặc định: auth tắt (dev local).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream atz_desk_api {
    server api:8000;
    keepalive 16;
}

server {
    listen 8080;
    server_name localhost dev.atz.vn;

    root /usr/share/atz/frontend;
    index index.html;

    client_max_body_size 4m;

    # --- Authentik ForwardAuth (tắt mặc định) ---
    # Khi ENABLE_FORWARD_AUTH=1, include logic tương đương nginx_dev.conf:
    #   auth_request /outpost.goauthentik.io/auth/nginx;
    #   error_page 401 = @goauthentik_proxy_signin;
    # Outpost URL (container Authentik ngoài stack): http://authentik-server:9000/outpost.goauthentik.io/auth/nginx

    location /healthz {
        proxy_pass http://atz_desk_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    location /outpost.goauthentik.io/ {
        # Chỉ dùng khi nginx join mạng Authentik — proxy tới outpost embedded
        return 404;
    }

    location /api/ {
        proxy_pass http://atz_desk_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location /ws/ {
        proxy_pass http://atz_desk_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
