# Trạm Trading — dev.atz.vn (Phase P1–P4 + Phase 3A Risk/Advisor scaffolding)
# Số null / [] = placeholder — Hiến điền từ spreadsheet sau.

brokerage_fee_rate: 0.0015   # 0.15%
sell_tax_rate: 0.001         # 0.1%
max_tranche: 5
default_user: default_user
redis_hash: priceboard:quotes
quote_field: last

# --- Phase 3A: Risk Management scaffolding ---
position_sizing:
  # Tỷ trọng đi lệnh (% NAV) — Hiến điền
  default_equity_pct: null
  max_positions: null
  min_lot: 100
  tranche_weights: []   # vd. [0.2, 0.3, 0.5]

risk_tolerance:
  # Profile rủi ro theo user (Authentik username → key bên dưới)
  default_profile: default
  user_profiles: {}
  # user_profiles:
  #   qhtran: owner
  #   hien: hien
  profiles:
    default:
      stop_loss_pct: null
      take_profit_pct: null
      max_portfolio_risk_pct: null
      note: "điền từ spreadsheet"
    owner:
      stop_loss_pct: null
      take_profit_pct: null
      max_portfolio_risk_pct: null
      note: "profile bạn — điền sau"
    hien:
      stop_loss_pct: null
      take_profit_pct: null
      max_portfolio_risk_pct: null
      note: "profile Hiến — điền sau"

# Ngưỡng / trọng số advisor (Hướng 1). Có thể override theo profile.
scoring_thresholds:
  weights:
    trend: 0.40
    flow: 0.30
    short_term: 0.30
  buy_min_total: 65
  sell_max_total: 35
  trend:
    ma_fast: 10
    ma_slow: 50
    cross_window: 2
  flow:
    foreign_days: 5
    foreign_min_net_vol: 0
    volume_avg: 20
    volume_spike: 2.0
  short_term:
    rsi_length: 14
    rsi_buy_zone: [30, 45]
    rsi_sell_above: 70
    bb_length: 20
    bb_k: 2.0
  # Override mỏng theo profile (merge đè lên khối trên)
  profiles:
    default: {}
    owner: {}
    hien: {}
