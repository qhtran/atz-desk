# Module 4 - Live Position Monitor. Theo docs/architecture.md mục 5
# và docs/troubleshooting.md. Ghi đè bằng env POS_* (xem position_monitor/config.py).
position_monitor:
  consumer:                          # Price Subscriber: event giá từ stream:quotes
    stream: "stream:quotes"
    group: "position-monitor"
    consumer_name: "pos-1"
    read_count: 200
    block_ms: 2000
    claim_min_idle_ms: 60000
    claim_every_seconds: 30
  sweep_seconds: 15                  # ngoài event: định kỳ đọc quote:{symbol} cho mọi vị thế mở (P&L + stale)
  positions_reload_seconds: 30       # đọc lại bảng positions (vị thế mới/đóng)
  price_read_timeout_seconds: 2      # "Timeout đọc giá"
  quote_key: "quote:{symbol}"
  stale:
    max_quote_age_seconds: 120       # quote cũ hơn -> stale (ERR-POS-001), không cảnh báo SL/TP/biến động
    ingest_health_key: "ingest:health"
    ingest_max_age_seconds: 120      # heartbeat ingestion cũ hơn -> stale
    degraded_is_stale: true          # ingestion mode=degraded -> stale
    log_every_seconds: 300           # ERR-POS-001 tối đa 1 lần/mã/5 phút
  volatility:                        # biến động bất thường: |giá/giá đầu cửa sổ - 1| >= ngưỡng
    enabled: true
    window_seconds: 300
    threshold_pct: 3.0
    dedup_seconds: 1800              # 1 cảnh báo / vị thế / chiều / 30 phút
  alert:                             # Alert Bridge -> Module 3 (Signal contract trên stream:signals)
    stream: "stream:signals"
    maxlen: 100000
    filter_names: {sl: "pos_stop_loss", tp: "pos_take_profit", vol: "pos_volatility"}
  live:
    key: "pos:live:{user_id}"        # hash position_id -> JSON P&L (cho UI Module 5)
    ttl_seconds: 86400
  health:
    key: "pos:health"
    max_age_seconds: 120
redis:
  url: redis://redis:6379/0
sqlite:
  path: /app/data/signals.db
