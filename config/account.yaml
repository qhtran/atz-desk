# Trang Tài khoản (Phase 1, docs/specs/ACCOUNT_UX_AUTHENTIK_BFF.md).
# Danh tính lấy từ header X-authentik-* do nginx forward auth gắn; không gọi Authentik API.
# Chỉ URL công khai, không để secret ở đây. URL rỗng thì nút tương ứng bị ẩn.
account:
  enabled: true
  # Unified Login: để trống — SPA dùng Desk Session modal, không redirect auth.atz.vn / Outpost.
  login_url: ""
  logout_url: ""
  # (Legacy Outpost — chỉ khi desk_session.form_login=false)
  # login_url: "https://dev.atz.vn/outpost.goauthentik.io/start?rd=https%3A%2F%2Fdev.atz.vn%2F"
  # logout_url: "https://dev.atz.vn/outpost.goauthentik.io/sign_out"
  password_flow_url: "https://auth.atz.vn/if/flow/default-password-change/"
  mfa_flow_url: "https://auth.atz.vn/if/flow/default-authenticator-totp-setup/"
  # Group Authentik → quyền Admin Control Panel (client + API guard).
  # Tên group trên auth.atz.vn hiện tại: Administrator / authentik Admins.
  admin_groups:
    - admin
    - atz-admins
    - Administrator
    - authentik Admins
  # DEV headless form (ROPC) — bật khi compose set DESK_SESSION_AUTH=1 + AUTHENTIK_* env.
  # Secrets chỉ trong env: AUTHENTIK_CLIENT_ID/SECRET, AUTHENTIK_TOKEN_URL, DESK_SESSION_SECRET.
  desk_session:
    form_login: true
  # Phase 2 only:
  # authentik_api_url: ""  # prefer https://auth.atz.vn, không nối network internal
