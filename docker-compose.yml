services:
  vnstocks:
    build:
      context: .
      secrets:
        - vnstock_index
    container_name: vnstocks
    restart: unless-stopped
    ports: ["127.0.0.1:8501:8501"]
    volumes: ["./data:/app/data", "./vnstock_home:/root/.vnstock"]
    env_file: [".env"]
    environment:
      # Kill-switch debug UI (không cần rebuild): ATZ_DEBUG_OVERLAY=0 rồi up -d --no-deps vnstocks
      ATZ_DEBUG_OVERLAY: ${ATZ_DEBUG_OVERLAY:-1}
      ATZ_DEBUG_TABLE_DEEP: ${ATZ_DEBUG_TABLE_DEEP:-1}
    networks: [default, realtime]   # Module 5: đọc Redis (quote/pos:live/inapp/health) cho UI realtime
  # --- Module 1: realtime ingestion (docs/architecture.md mục 2) ---
  redis:
    image: redis:7-alpine
    container_name: atz-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec",
              "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    volumes: ["./redis_data:/data"]
    networks: [realtime]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  ingestion:
    image: vnstocks-vnstocks   # cùng image với app (build bởi service vnstocks)
    container_name: atz-ingestion
    restart: unless-stopped
    command: ["python", "-m", "ingestion"]
    depends_on:
      redis:
        condition: service_healthy
    volumes: ["./vnstock_home:/root/.vnstock", "./logs:/app/logs"]
    environment:
      INGEST_CONFIG: /app/config/ingestion.yaml
      INGEST_LOG_DIR: /app/logs
    env_file: [".env", ".env.ingestion"]
    networks: [default, realtime]   # default: ra Internet tới KBS/VCI; realtime: tới Redis
    healthcheck:
      test: ["CMD", "python", "-m", "ingestion.health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  filter-runner:
    image: vnstocks-vnstocks   # cùng image với app
    container_name: atz-filter-runner
    restart: unless-stopped
    command: ["python", "-m", "filter_runner"]
    depends_on:
      redis:
        condition: service_healthy
    volumes: ["./data:/app/data", "./vnstock_home:/root/.vnstock", "./logs:/app/logs"]
    environment:
      FILTER_CONFIG: /app/config/filter_runner.yaml
      FILTER_LOG_DIR: /app/logs
    env_file: [".env"]
    networks: [default, realtime]   # default: loader nến của app có thể gọi vnstock; realtime: Redis
    healthcheck:
      test: ["CMD", "python", "-m", "filter_runner.health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  alert-dispatcher:
    image: vnstocks-vnstocks   # cùng image với app (Module 3)
    container_name: atz-alert
    restart: unless-stopped
    command: ["python", "-m", "alert_dispatcher"]
    depends_on:
      redis:
        condition: service_healthy
    volumes: ["./data:/app/data", "./logs:/app/logs"]
    environment:
      ALERT_CONFIG: /app/config/alert_dispatcher.yaml
      ALERT_LOG_DIR: /app/logs
    env_file: [".env", ".env.alert"]
    networks: [default, realtime]   # default: ra Internet tới Telegram/Brevo; realtime: Redis
    healthcheck:
      test: ["CMD", "python", "-m", "alert_dispatcher.health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  position-monitor:
    image: vnstocks-vnstocks   # cùng image với app (Module 4)
    container_name: atz-position
    restart: unless-stopped
    command: ["python", "-m", "position_monitor"]
    depends_on:
      redis:
        condition: service_healthy
    volumes: ["./data:/app/data", "./logs:/app/logs"]
    environment:
      POS_CONFIG: /app/config/position_monitor.yaml
      POS_LOG_DIR: /app/logs
    networks: [realtime]   # chỉ cần Redis + SQLite, không ra Internet
    healthcheck:
      test: ["CMD", "python", "-m", "position_monitor.health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  # --- Thẻ chỉ số kiểu FireAnt: VNINDEX/HNX/UPCOM/VN30/VN30F1M/F2M -> idx:quote:*, spark:* (config/index.yaml) ---
  index-feed:
    image: vnstocks-vnstocks   # cùng image với app; tách khỏi atz-ingestion để không đụng đường quote vnstock 350 rpm
    container_name: atz-index
    restart: unless-stopped
    command: ["python", "-m", "ingestion.index"]
    depends_on:
      redis:
        condition: service_healthy
    volumes: ["./logs:/app/logs"]
    environment:
      IDX_CONFIG: /app/config/index.yaml
      INGEST_LOG_DIR: /app/logs/index
    env_file: [".env"]            # SSI_CONSUMER_ID / SSI_CONSUMER_SECRET (nếu có) bật provider SSI
    networks: [default, realtime]  # default: ra Internet tới Vietcap/Entrade/SSI; realtime: Redis
    healthcheck:
      test: ["CMD", "python", "-m", "ingestion.index.health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  # --- SSI Market WebSocket primary → idx:quote spot (ADR 0008); REST index-feed = backup ---
  ssi-stream:
    image: vnstocks-vnstocks
    container_name: atz-ssi-stream
    restart: unless-stopped
    command: ["python", "-m", "ingestion.ssi_stream"]
    depends_on:
      redis:
        condition: service_healthy
    volumes: ["./logs:/app/logs"]
    environment:
      SSI_STREAM_CONFIG: /app/config/ssi_stream.yaml
      INGEST_LOG_DIR: /app/logs/ssi_stream
    env_file: [".env"]
    networks: [default, realtime]
    healthcheck:
      test: ["CMD", "python", "-m", "ingestion.ssi_stream.health"]
      interval: 30s
      timeout: 10s
      start_period: 45s
      retries: 3

secrets:
  vnstock_index:
    file: ./.pip_index

networks:
  realtime:
    internal: true
